[tools]
# Keep the Rust version in step with rust-toolchain.toml (used by the Windows build).
rust = { version = "1.100.0", components = "clippy,rustfmt" }
# Release notes from the commits (cliff.toml); the release workflow uses the same version.
git-cliff = "2.14.2"
# The licences of every crate built into the app (about.toml), shown in Settings → About.
"ubi:EmbarkStudios/cargo-about" = "0.9.3"

[env]
# Real save files used as test fixtures (personal data, never commit)
ETS2_FIXTURES = "{{config_root}}/fixtures"

[tasks.check]
description = "Format check, Clippy (warnings are errors) and all tests"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
]

[tasks.licenses]
description = "List the licence of every crate built into the app (crates/app/assets/licenses.txt, shown in Settings → About)"
run = "cargo about generate --manifest-path crates/app/Cargo.toml about.hbs -o crates/app/assets/licenses.txt"

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace"

[tasks.fmt]
description = "Format everything"
run = "cargo fmt --all"

[tasks.app]
description = "Run the desktop app in WSL (WSLg)"
run = "cargo run -p app"

[tasks.win]
description = "Build the Windows .exe (on Windows, driven from WSL)"
run = "scripts/windows.sh build"

[tasks.win-run]
description = "Build the Windows .exe and start it"
run = "scripts/windows.sh run"

[tasks.release-notes]
description = "Preview the next release's notes, written from the commits since the last tag"
run = "git-cliff --unreleased --strip all"
