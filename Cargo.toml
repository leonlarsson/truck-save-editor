[workspace]
resolver = "3"
members = ["crates/sii", "crates/save", "crates/hashfs", "crates/gamedata", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/leonlarsson/truck-save-editor"

[workspace.dependencies]
sii = { path = "crates/sii" }
save = { path = "crates/save" }

# GPUI Kit (GPUI + gpui-component + assets) is pinned exactly: its API changes between releases.
gpui-kit = "=0.10.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.dev.package."*"]
# Dependencies (GPUI is big) build optimised, so the app runs smoothly while developing.
opt-level = 2

# The crates that read the game's files build optimised too: unoptimised, reading the game's data
# and its map at startup takes about 18 seconds in a development build instead of a few.
[profile.dev.package.sii]
opt-level = 2

[profile.dev.package.hashfs]
opt-level = 2

[profile.dev.package.gamedata]
opt-level = 2

[profile.dev.package.save]
opt-level = 2
