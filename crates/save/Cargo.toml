[package]
name = "save"
description = "The ETS2/ATS save: profiles and slots, the document model, typed access, edits and safe writing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["native"]
# Disk access: finding profiles, backups and writing. Off for WebAssembly builds.
native = ["dep:dirs", "dep:sysinfo", "dep:winreg"]

[dependencies]
dirs = { version = "7.0.0", optional = true }
sii.workspace = true
sysinfo = { version = "0.40.4", default-features = false, features = ["system"], optional = true }
thiserror = "2.0.21"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
winreg = { version = "0.56.0", optional = true }

[dev-dependencies]
sii.workspace = true
