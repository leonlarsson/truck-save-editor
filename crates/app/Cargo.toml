[package]
name = "app"
description = "Truck Save Editor: the desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "truck-save-editor"
path = "src/main.rs"

[dependencies]
save.workspace = true
sii.workspace = true
gamedata = { path = "../gamedata" }
hashfs = { path = "../hashfs" }
gpui-kit.workspace = true
dirs = "7.0.0"
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
image = { version = "0.25", default-features = false }

[dev-dependencies]
# UI integration tests: headless windows driven by real clicks and keys.
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[build-dependencies]
embed-resource = "3"
