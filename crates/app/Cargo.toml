[package]
name = "app"
description = "Truck Save Editor: the desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "truck-save-editor"
path = "src/main.rs"

[dependencies]
save.workspace = true
sii.workspace = true
gamedata = { path = "../gamedata" }
hashfs = { path = "../hashfs" }
gpui-kit.workspace = true
dirs = "7.0.0"
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# Asking GitHub for the latest release (updates.rs): the only time the editor uses the network.
ureq = "3.5.2"
serde_json = "1.0.154"

[dev-dependencies]
# UI integration tests: headless windows driven by real clicks and keys.
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[build-dependencies]
embed-resource = "3"
