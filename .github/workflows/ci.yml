name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  # Every push to main gets a full build; only pull requests drop superseded runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Save format (sii, save)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p sii -p save --all-targets -- -D warnings
      - run: cargo test -p sii -p save
      # The app shows every crate's licence (Settings → About); the list it's built with must
      # match the crates it's built from.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3 # as in mise.toml
      - name: The licence list is up to date (mise run licenses)
        run: |
          cargo about generate --manifest-path crates/app/Cargo.toml about.hbs -o crates/app/assets/licenses.txt
          git diff --exit-code crates/app/assets/licenses.txt || {
            echo "::error::crates/app/assets/licenses.txt is out of date: run mise run licenses and commit it."
            exit 1
          }

  app:
    # GPUI compiles its DirectX shaders with the Windows SDK, so the app is built on Windows.
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p app --all-targets -- -D warnings
      - run: cargo test -p app
      - run: cargo build -p app --release
      - uses: actions/upload-artifact@v4
        with:
          name: truck-save-editor-windows
          path: target/release/truck-save-editor.exe
