# Builds the Windows app for a version tag (v0.1.0 …) and puts it in a DRAFT release, for the
# owner to try and publish by hand. Nothing is published by this workflow. See docs/releasing.md.
#
# Run it by hand (Actions → Release → Run workflow) for a rehearsal: the same build, package and
# notes, kept as a workflow artifact, with no release and no attestation.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # GPUI compiles its DirectX shaders with the Windows SDK, so the app is built on Windows.
    name: Build for Windows
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Version (and that the tag matches it)
        id: version
        shell: pwsh
        run: |
          $packages = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages
          $version = ($packages | Where-Object name -eq 'app').version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            Write-Error "The tag ${{ github.ref_name }} doesn't match the version in Cargo.toml ($version). Tag v$version, or bump the version first (docs/releasing.md)."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: cargo test --locked -p sii -p save -p hashfs -p gamedata -p live -p app
      # Live's plugin first: the app's build puts it inside the .exe (crates/app/build.rs).
      - run: cargo build --locked -p live-plugin --release
      - run: cargo build --locked -p app --release
      - name: Check the plugin is inside the .exe
        shell: pwsh
        run: |
          $exe = [System.IO.File]::ReadAllBytes("target/release/truck-save-editor.exe")
          # The plugin's entry point is named in its bytes, and nowhere in the app's own code.
          $text = [System.Text.Encoding]::ASCII.GetString($exe)
          if (-not $text.Contains("scs_telemetry_init")) {
            Write-Error "The .exe doesn't carry Live's plugin (tse_live.dll). Was it built before the app?"
            exit 1
          }
      - name: Check the .exe (no C runtime DLL, no console window)
        shell: pwsh
        run: |
          # .cargo/config.toml links the runtime in; without it the .exe won't start on a PC
          # without the Visual C++ Redistributable.
          $bytes = [System.IO.File]::ReadAllBytes("target/release/truck-save-editor.exe")
          if ([System.Text.Encoding]::ASCII.GetString($bytes) -match 'VCRUNTIME140') {
            Write-Error "The .exe needs VCRUNTIME140.dll. Is the crt-static setting in .cargo/config.toml in effect?"
            exit 1
          }
          # The PE header's subsystem: 2 is a Windows app, 3 a console program (which opens a
          # terminal window next to the app). main.rs sets it for release builds.
          $header = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $header + 4 + 20 + 68)
          if ($subsystem -ne 2) {
            Write-Error "The .exe is a console program (subsystem $subsystem): it would open a terminal window. Check windows_subsystem in main.rs."
            exit 1
          }
      - name: Package
        shell: pwsh
        run: |
          # The .exe alone: everything it needs is inside it, the licences of what's built into
          # it too (Settings → About → Open-source licences), so they go wherever it's copied.
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/truck-save-editor.exe "dist/truck-save-editor-${{ steps.version.outputs.version }}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  draft:
    name: Draft the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release
      id-token: write # signing the attestation
      attestations: write # storing it
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every commit and tag, for the notes
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2 # as in mise.toml
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum *.exe > SHA256SUMS.txt
      - name: Notes
        run: |
          # The hand-written notes for this version when there are some (without their opening
          # comment); otherwise drafted from the commits: this tag's for a release, everything not
          # yet tagged for a rehearsal.
          written="docs/release-notes/$VERSION.md"
          if [ -f "$written" ]; then
            perl -0pe 's/\A\s*<!--.*?-->\s*//s' "$written" > notes.md
          else
            if [ "$GITHUB_REF_TYPE" = tag ]; then range=--latest; else range=--unreleased; fi
            git-cliff $range --strip all > notes.md
          fi
          echo >> notes.md
          sed -e "s/{version}/$VERSION/g" -e "s|{repository}|$GITHUB_REPOSITORY|g" \
            .github/release-footer.md >> notes.md
      - name: Attest where the files came from
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.exe
      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a dash (0.2.0-beta.1) is a pre-release.
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # Titled like every release: "Truck Save Editor 0.3.0" (the name from crates/app/build.rs,
          # the one place it's written), then the notes' headline when their opening comment has a
          # "Headline:" line: "Truck Save Editor 0.4.0: American Truck Simulator support".
          product="$(sed -n 's/^const PRODUCT_NAME: &str = "\(.*\)";/\1/p' crates/app/build.rs)"
          title="$product $VERSION"
          written="docs/release-notes/$VERSION.md"
          if [ -f "$written" ]; then
            headline="$(perl -0ne 'print $1 if /\A\s*<!--(?:(?!-->).)*?\bHeadline:[ \t]*(.+?)[ \t]*$/ms' "$written")"
            if [ -n "$headline" ]; then title="$title: $headline"; fi
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/SHA256SUMS.txt \
            --draft $prerelease --verify-tag --title "$title" --notes-file notes.md
      - name: Keep the rehearsal
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            notes.md
